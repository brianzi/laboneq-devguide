site_name: LabOne Q Developer Guide
site_description: Developer-oriented architecture guide for zhinst/laboneq
site_author: Manus AI
repo_url: https://github.com/brianzi/laboneq-devguide
edit_uri: edit/main/docs/

use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-auto
        name: Follow system color scheme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Orientation:
      - Guide overview: index.md
      - User-facing interfaces and frontend internals: 02a-user-facing-interfaces.md
      - Serialization and pulse-sheet inspection: 02b-serialization-and-pulse-sheets.md
      - Mental model: 01-mental-model.md
      - Repository and build map: 02-repository-and-build-map.md
      - Ecosystem and hardware context: 10-ecosystem-and-hardware.md
  - Compilation pipeline:
      - Python DSL and compiler payload: 03-python-dsl-and-payload.md
      - Global scheduling: 04-global-scheduling.md
      - Global scheduling implementation: 04a-global-scheduling-implementation.md
      - IR semantics: 05-ir-semantics.md
      - Backend resource mapping: 06-backend-resource-mapping.md
      - Feedback representation and hardware lowering: 07a-feedback-compilation.md
      - AWG-local lowering and multiplexing: 07-awg-local-lowering.md
      - Code generation artifacts: 08-code-generation-artifacts.md
  - Runtime and data semantics:
      - Runtime controller: 09-runtime-controller.md
      - Device communication layer: 12-device-layer.md
      - Results, handles, and data shapes: 13-results-and-data.md
  - Higher-level application layers:
      - Overview: 17-quantum-objects-and-workflows.md
      - Quantum elements and QPU: 17a-quantum-elements-and-qpu.md
      - Quantum operations: 17b-quantum-operations.md
      - Workflows: 17c-workflows.md
  - Maintenance reference:
      - Extension and maintenance guide: 11-extension-and-maintenance.md
      - Source reference map: 15-source-reference.md
      - Glossary: 16-glossary.md
      - References: references.md
